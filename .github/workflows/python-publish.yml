name: Publish

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build
      - name: Check the build version matches the tag
        run: test -f "dist/edupage_api-${GITHUB_REF_NAME}-py3-none-any.whl"
      - name: Check the tag is on master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
  
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/edupage-api
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e . pdoc
      - run: pdoc edupage_api -o site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
  
  deploy-docs:
    needs: [docs, publish]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
